<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Anggota Baru</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #f00;
            color: white;
            padding: 1rem 1.5rem;
        }

        header h1 {
            font-size: 1.4rem;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        section {
            width: 100%;
            max-width: 450px;
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        section h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #f00;
        }

        form p {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #f00;
        }

        button {
            width: 100%;
            padding: 0.7rem;
            background-color: #f00;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        button:hover {
            background-color: #164869;
        }

        form p:last-child {
            text-align: center;
        }

        a {
            color: #f00;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <header>
        <h1>PERPUSTAKAAN MINI</h1>
    </header>

    <main>
        <section>
            <h2>REGISTRASI ANGGOTA BARU</h2>

            <form>
                <p>
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                    >
                </p>

                <p>
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                    >
                </p>

                <p>
                    <label for="telepon">Nomor Telepon</label>
                    <input 
                        type="tel" 
                        id="telepon" 
                        name="telepon"
                    >
                </p>

                <p>
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                    >
                </p>

                <button type="submit">Buat Akun</button>

                <p>
                    Sudah Punya Akun?
                    <a href="login.html">Login</a>
                </p>
            </form>
        </section>
    </main>

</body>
</html>
